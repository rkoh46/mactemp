name: Release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build app + DMG
        run: ./release.sh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: MacTemp ${{ github.ref_name }}
          files: dist/MacTemp.dmg
          generate_release_notes: true
